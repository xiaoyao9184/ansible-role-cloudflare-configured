---
# defaults file for cloudflare-configured
#
# 0. OS-specific variables
#
# Define OS-specific vars file for override default
# If enabled, some variables will be overridden by those in the `vars` path.
cloudflared_os_specific_vars_included: true
# Define OS-specific vars path for override default
cloudflared_os_specific_vars_path: "NONE"
#
# Package variables
#
cloudflared_package_name: cloudflared
# `latest` install the latest version
# `any` install any available version
# `<version>` install the specified version
cloudflared_package_version: latest
#
# 1. Installation variables
#
# installation mode
#
# `native` use OS-native package or binary installation paths
# `docker` use a Docker container delivery path
cloudflared_installation_mode: native
#
# base url for github api
cloudflared_github_base_url: https://github.com
# repository name
cloudflared_github_repository: cloudflare/cloudflared
# ansible architecture to github release asset architecture mapping,
# it will override by in `vars/` dir
# key is ansible architecture, value is github release asset architecture
cloudflared_github_release_asset_arch_mapping: {}
#
# debian package source
#
# `repository` use apt repository for install
# `github` use github releases file for install
# auto override to `github` if cloudflared package version specified
cloudflared_debian_source: repository
#
# apt key management
#
# keyrings: manage /etc/apt/keyrings directly
cloudflared_debian_repository_keyring_url: https://pkg.cloudflare.com/cloudflare-main.gpg
# `<path>` like `/etc/apt/trusted.gpg.d/*` use apt_key first fallback to get_url
# `<path>` like `/etc/apt/keyrings/*` use get_url
# `<url>` use the key URL directly in the repository (non-persistent)
# `MAPPING` auto map by system codename
cloudflared_debian_repository_keyring: MAPPING
# codename to key ring mapping, it will override by in `vars/` dir
cloudflared_debian_repository_keyring_codename_mapping: {}
#
# apt repository management
#
# `list` use apt_repository for .list files
# `deb822` use deb822_repository for .sources files
# `MAPPING` auto map by system codename
cloudflared_debian_repository_format: MAPPING
# codename to format mapping, it will override by in `vars/` dir
cloudflared_debian_repository_format_codename_mapping: {}
cloudflared_debian_repository_channel: stable
cloudflared_debian_repository_filename: cloudflared
cloudflared_debian_repository_suite: any
cloudflared_debian_repository_component: main
cloudflared_debian_repository_url_channel_mapping:
  stable: https://pkg.cloudflare.com/cloudflared
  nightly: https://next.pkg.cloudflare.com/cloudflared
cloudflared_debian_repository_url: >-
  {{
    cloudflared_debian_repository_url_channel_mapping[cloudflared_debian_repository_channel]
  }}
#
# redhat package source
#
# `repository` use rpm repository for install
# `github` use github releases file for install
# auto override to `github` if cloudflared package version specified
cloudflared_redhat_source: repository
#
# rpm repository management
#
# distribution support tier mapping,
# it will override by in `vars/` dir
cloudflared_redhat_distribution_support_tier_mapping: {}
# distribution/release to package manager mapping,
# it will override by in `vars/` dir
cloudflared_redhat_package_manager_distribution_major_mapping: {}
cloudflared_redhat_repository_url: https://pkg.cloudflare.com/cloudflared.repo
cloudflared_redhat_repository_path: /etc/yum.repos.d/cloudflared.repo
#
# macos package source
#
# `brew` use Homebrew for install
# `github` use github releases file for install
# auto override to `github` if cloudflared package version specified
cloudflared_macos_source: brew
#
# homebrew repository management
#
cloudflared_macos_brew_command: brew
cloudflared_macos_brew_package_name: cloudflared
cloudflared_macos_binary_candidates:
  - /opt/homebrew/bin/cloudflared
  - /usr/local/bin/cloudflared
cloudflared_macos_github_binary_path: /usr/local/bin/cloudflared
#
# windows package source
#
# `winget` use Windows Package Manager for install
# `github` use github releases file for install
# auto override to `github` if cloudflared package version specified
cloudflared_windows_source: winget
#
# winget package management
#
cloudflared_windows_winget_command: winget
cloudflared_windows_winget_package_id: Cloudflare.cloudflared
cloudflared_windows_binary_candidates:
  - C:\Program Files\cloudflared\cloudflared.exe
  - C:\Program Files (x86)\cloudflared\cloudflared.exe
cloudflared_windows_github_binary_path: C:\Program Files\cloudflared\cloudflared.exe
#
# openwrt package name
#
# set to `luci-app-cloudflared` if that package should be managed instead
cloudflared_openwrt_package_name: cloudflared
#
# docker installation settings
#
cloudflared_docker_host: unix:///var/run/docker.sock
cloudflared_docker_image_repository: cloudflare/cloudflared
cloudflared_docker_container_name: cloudflared
cloudflared_docker_container_command: []
#
# 2. Configuration variables
#
# tunnel create settings
#
# cloudflared binary path on controller node
cloudflared_controller_binary_path: "~/.cloudflared/cloudflared"
# account certificate file on controller node
cloudflared_account_cert_file: ""
# tunnel name for creation
cloudflared_tunnel_name: ""
# tunnel credentials file path for creation on controller node
cloudflared_tunnel_credentials_file: ""
#
# tunnel token settings
#
# tunnel token used for generate credentials file
cloudflared_tunnel_token: ""
#
# config file settings
#
# tunnel config destination path
cloudflared_config_file_target_path: "{{ ansible_facts['user_dir'] | default(lookup('ansible.builtin.env', 'HOME'),true) }}/.cloudflared/config.yml"
# whether to use become when writing the config file
cloudflared_config_file_become: false
# source mode used to build the config file
# `copy` copies a local source file
# `template` renders a local template file
# `vars` serializes a variable mapping as YAML
cloudflared_config_file_source_mode: vars
# local source file used by `copy` mode
cloudflared_config_file_source_copy_file: ""
# local template file used by `template` mode
cloudflared_config_file_source_template_file: ""
# structured content serialized as YAML by `vars` mode
cloudflared_config_file_source_vars_content: {}
#
# 3. Control variables
#
# logical service name used by native service managers and docker container naming
# empty string means skip service management
cloudflared_service_name: cloudflared
# whether the cloudflared service should be enabled
cloudflared_service_enabled: true
# current desired service state
# `started` ensures the runtime unit is running
# `stopped` ensures the runtime unit is stopped
# `restarted` restarts the runtime unit
# `reloaded` reloads the runtime unit when supported
cloudflared_service_state: started
