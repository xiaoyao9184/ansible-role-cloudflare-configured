---
- name: Converge | github source
  hosts: all
  gather_facts: false
  roles:
    - role: codex_with_openspec.cloudflare_configured
      vars:
        cloudflared_redhat_source: github
  tasks:
    - name: github source | assert
      ansible.builtin.assert:
        that:
          - cloudflared_facts_redhat_support_tier == 'direct'
          - cloudflared_facts_redhat_distribution_is_supported == true
          - cloudflared_facts_redhat_package_manager == 'dnf'
          - cloudflared_facts_version_mode == 'latest'
          - cloudflared_facts_is_installed == true
          - cloudflared_facts_installed_version != ''
          - cloudflared_facts_redhat_install_required == true
          - cloudflared_tasks_redhat_source == 'github'
          - cloudflared_facts_redhat_package_spec is not defined
          - cloudflared_facts_redhat_package_state is not defined
          - cloudflared_facts_github_release_tag == 'latest'
          - cloudflared_facts_github_release_asset == 'cloudflared-linux-x86_64.rpm'
          - cloudflared_facts_github_release_url == 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-x86_64.rpm'
          - cloudflared_result_github_download_dir is changed
          - cloudflared_result_github_package_download is changed
