---
# skip role name check
# see https://github.com/ansible/ansible-compat/issues/78
role_name_check: 1

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu2004
    image: geerlingguy/docker-ubuntu2004-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host

provisioner:
  name: ansible
  playbooks:
    converge: converge.list-repository.yml

scenario:
  name: docker-ubuntu-2004

  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # The `cloudflared_facts_is_installed` variable will change after `idempotence`
    # - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
