---
- name: Converge | specific version
  hosts: all
  gather_facts: false
  roles:
    - role: codex_with_openspec.cloudflare_configured
      vars:
        cloudflared_package_version: 2026.2.0
  tasks:
    - name: specific version | assert
      ansible.builtin.assert:
        that:
          - cloudflared_facts_macos_distribution_is_supported == true
          - cloudflared_facts_macos_binary_path != ''
          - cloudflared_facts_is_installed == true
          - cloudflared_facts_installed_version != ''
          - cloudflared_facts_version_mode == 'specific'
          - cloudflared_facts_macos_install_required == true
          - cloudflared_tasks_macos_source == 'github'
          - cloudflared_result_macos_brew_version is not defined
          - cloudflared_result_macos_brew_info is not defined
          - cloudflared_facts_macos_brew_stable_version is not defined
          - cloudflared_facts_macos_brew_installed_versions is not defined
          - cloudflared_facts_github_release_tag == '2026.2.0'
          - cloudflared_facts_github_release_asset in [
              'cloudflared-darwin-amd64.tgz',
              'cloudflared-darwin-arm64.tgz'
            ]
          - cloudflared_facts_github_release_url in [
              'https://github.com/cloudflare/cloudflared/releases/download/2026.2.0/cloudflared-darwin-amd64.tgz',
              'https://github.com/cloudflare/cloudflared/releases/download/2026.2.0/cloudflared-darwin-arm64.tgz'
            ]
          - cloudflared_result_github_download_dir is changed
          - cloudflared_result_github_package_download is changed
