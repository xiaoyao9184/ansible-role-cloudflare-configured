---
- name: Converge | credentials from vars
  hosts: all
  gather_facts: false
  roles:
    - role: codex_with_openspec.cloudflare_configured
      vars:
        cloudflared_package_version: any
        cloudflared_credentials_file_target_path: "%TEMP%\\cloudflare_configured\\cloudflared-vars.json"
        cloudflared_credentials_file_source_mode: vars
        cloudflared_credentials_file_source_vars_content:
          AccountTag: test-account
          TunnelID: test-id
          TunnelSecret: test-secret

        cloudflared_config_file_target_path: "%TEMP%\\cloudflare_configured\\cloudflared-vars.yml"
        cloudflared_config_file_become: false
        cloudflared_config_file_source_mode: vars
        cloudflared_config_file_source_vars_content: {}
  tasks:
    - name: vars | assert
      ansible.builtin.assert:
        that:
          - cloudflared_facts_config_host_type == 'windows'

          - cloudflared_result_credentials_file_copy is skipped
          - cloudflared_result_credentials_file_vars is not skipped
          - cloudflared_result_credentials_file_token is skipped

    - name: vars | inspect credentials file
      ansible.windows.win_stat:
        path: "%TEMP%\\cloudflare_configured\\cloudflared-vars.json"
      register: cloudflared_result_credentials_file_target_stat

    - name: vars | read credentials file
      ansible.windows.slurp:
        src: "%TEMP%\\cloudflare_configured\\cloudflared-vars.json"
      register: cloudflared_result_credentials_file_target_content

    - name: vars | assert
      ansible.builtin.assert:
        that:
          - cloudflared_result_credentials_file_target_stat.stat.exists
          - >-
            (
              cloudflared_result_credentials_file_target_content.content
              | b64decode
              | from_json
            )
            ==
            {
              'AccountTag': 'test-account',
              'TunnelID': 'test-id',
              'TunnelSecret': 'test-secret'
            }
