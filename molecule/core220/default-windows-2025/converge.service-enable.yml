---
- name: Converge | service enable
  hosts: windows2025
  gather_facts: false
  roles:
    - role: codex_with_openspec.cloudflare_configured
      vars:
        # Reuse the version installed in the previous Converge installation.
        cloudflared_package_version: any
        # Create a tunnel using a real account.
        cloudflared_account_cert_file: >-
          {{
            lookup('env', 'HOME')
            | default('/home/nonroot', true)
            ~
            '/.cloudflared/cert.pem'
          }}
        cloudflared_tunnel_name: >-
          {{
            lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
            | default('ansible-role-cloudflare-configured-test-tunnel', true)
          }}
        cloudflared_tunnel_credentials_file: >-
          {{
            lookup('env', 'HOME')
            | default('/home/nonroot', true)
            ~ '/.cloudflared/'
            ~ lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
              | default('ansible-role-cloudflare-configured-test-tunnel', true)
            ~ '.json'
          }}
        # Create empty credentials file
        cloudflared_credentials_file_target_path: "C:\\Windows\\System32\\config\\systemprofile\\.cloudflared\\credentials.json"
        cloudflared_credentials_file_become: true
        cloudflared_credentials_file_source_mode: vars
        # Create empty config file
        cloudflared_config_file_target_path: "C:\\Windows\\System32\\config\\systemprofile\\.cloudflared\\config.yml"
        cloudflared_config_file_become: true
        cloudflared_config_file_source_mode: vars
        # Start the service using the token created from the tunnel.
        cloudflared_tunnel_run_parameter_args:
          autoupdate-freq: ""
          config: "{{ cloudflared_config_file_target_path }}"
          dns-resolver-addrs: []
          edge-bind-address: ""
          edge-ip-version: ""
          grace-period: ""
          logfile: ""
          loglevel: ""
          metrics: ""
          no-autoupdate: false
          origincert: ""
          pidfile: ""
          post-quantum: ""
          protocol: ""
          region: ""
          retries: ""
          tag: ""
          token: >-
            {{
              hostvars['localhost'].cloudflared_facts_tunnel_results[
                lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                | default('ansible-role-cloudflare-configured-test-tunnel', true)
              ].token
            }}
          token-file: ""
  tasks:
    - name: service enable | inspect win service info
      ansible.windows.win_service_info:
        name: cloudflared
      register: molecule_result_service_info

    - name: service enable | assert
      ansible.builtin.assert:
        that:
          - molecule_result_service_info.exists
          - >-
            (
              molecule_result_service_info.services[0].path
              | regex_search('cloudflared.exe')
            ) is not none

          - cloudflared_facts_service_tunnel_shared_options == ['--config', 'C:\\Windows\\System32\\config\\systemprofile\\.cloudflared\\config.yml']
          - cloudflared_facts_service_tunnel_run_options | length > 0
          - cloudflared_facts_service_tunnel_cli_tail | length == 0
          - cloudflared_facts_service_command_args[:5] == ['tunnel', '--config', 'C:\\Windows\\System32\\config\\systemprofile\\.cloudflared\\config.yml', 'run', '--token']

          - >-
            (
              cloudflared_facts_service_binary_path
              | regex_search('cloudflared\\.exe')
            ) is not none
          - >-
            (
              cloudflared_facts_service_windows_service_path
              | regex_search('cloudflared\\.exe')
            ) is not none
          - >-
            (
              cloudflared_facts_service_windows_service_path
              | regex_search('C:\\\\Windows\\\\System32\\\\config\\\\systemprofile\\\\.cloudflared\\\\config.yml')
            ) is not none
          - cloudflared_result_service_windows_service_install is not skipped

    - name: service enable | stop
      ansible.windows.win_service:
        name: cloudflared
        state: absent
