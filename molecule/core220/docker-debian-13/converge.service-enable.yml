---
- name: Converge | service enable
  hosts: debian13
  gather_facts: false
  roles:
    - role: codex_with_openspec.cloudflare_configured
      vars:
        # Reuse the version installed in the previous Converge installation.
        cloudflared_package_version: any
        # Create a tunnel using a real account.
        cloudflared_account_cert_file: >-
          {{
            lookup('env', 'HOME')
            | default('/home/nonroot', true)
            ~
            '/.cloudflared/cert.pem'
          }}
        cloudflared_tunnel_name: >-
          {{
            lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
            | default('ansible-role-cloudflare-configured-test-tunnel', true)
          }}
        cloudflared_tunnel_credentials_file: >-
          {{
            lookup('env', 'HOME')
            | default('/home/nonroot', true)
            ~ '/.cloudflared/'
            ~ lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
              | default('ansible-role-cloudflare-configured-test-tunnel', true)
            ~ '.json'
          }}
        # Create empty credentials file
        cloudflared_credentials_file_target_path: /etc/cloudflared/credentials.json
        cloudflared_credentials_file_become: true
        cloudflared_credentials_file_source_mode: vars
        # Create empty config file
        cloudflared_config_file_target_path: /etc/cloudflared/config.yml
        cloudflared_config_file_become: true
        cloudflared_config_file_source_mode: vars
        # Start the service using the token created from the tunnel.
        cloudflared_tunnel_run_parameter_args:
          autoupdate-freq: ""
          config: "{{ cloudflared_config_file_target_path }}"
          dns-resolver-addrs: []
          edge-bind-address: ""
          edge-ip-version: ""
          grace-period: ""
          logfile: ""
          loglevel: ""
          metrics: ""
          no-autoupdate: false
          origincert: ""
          pidfile: ""
          post-quantum: ""
          protocol: ""
          region: ""
          retries: ""
          tag: ""
          token: >-
            {{
              hostvars['localhost'].cloudflared_facts_tunnel_results[
                lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                | default('ansible-role-cloudflare-configured-test-tunnel', true)
              ].token
            }}
          token-file: ""
  tasks:
    - name: service enable | inspect systemd service unit
      community.general.systemd_info:
        unitname:
          - cloudflared.service
      register: molecule_result_systemd_info
      until: molecule_result_systemd_info.units['cloudflared.service'].activestate == 'active'
      retries: 12
      delay: 5

    - name: service enable | inspect systemd service file
      ansible.builtin.stat:
        path: "/etc/systemd/system/cloudflared.service"
      register: molecule_result_service_stat

    - name: service enable | read systemd service file
      ansible.builtin.slurp:
        src: "/etc/systemd/system/cloudflared.service"
      register: molecule_result_service_content

    - name: service enable | assert
      ansible.builtin.assert:
        that:
          - molecule_result_systemd_info.units['cloudflared.service'].activestate == 'active'
          - molecule_result_systemd_info.units['cloudflared.service'].substate == 'running'
          - molecule_result_service_stat.stat.exists
          - >-
            (
              molecule_result_service_content.content
              | b64decode
              | regex_search('ExecStart=/usr/local/bin/cloudflared tunnel --config /etc/cloudflared/config.yml run( --token [^\\n ]+)?')
            ) is not none

          - cloudflared_facts_service_tunnel_shared_options == ['--config', '/etc/cloudflared/config.yml']
          - cloudflared_facts_service_tunnel_run_options | length > 0
          - cloudflared_facts_service_tunnel_cli_tail | length == 0
          - cloudflared_facts_service_command_args[:5] == ['tunnel', '--config', '/etc/cloudflared/config.yml', 'run', '--token']

          - cloudflared_result_service_binary_path is not skipped
          - cloudflared_facts_service_binary_path == "/usr/local/bin/cloudflared"
          - cloudflared_result_service_systemd_unit is succeeded

    - name: service enable | stop
      become: true
      ansible.builtin.systemd_service:
        name: cloudflared
        state: stopped
