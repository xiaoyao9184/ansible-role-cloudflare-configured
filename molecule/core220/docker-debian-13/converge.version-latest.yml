---
- name: Converge | latest version
  hosts: debian13
  gather_facts: false
  roles:
    - codex_with_openspec.cloudflare_configured
  tasks:
    - name: latest version | assert
      ansible.builtin.assert:
        that:
          - cloudflared_facts_is_installed == false
          - cloudflared_facts_installed_version == ''
          - cloudflared_facts_version_mode == 'latest'
          - cloudflared_facts_debian_install_required == true
          - cloudflared_tasks_debian_source == 'repository'
          - cloudflared_tasks_debian_key == 'keyrings'
          - cloudflared_tasks_debian_repository == 'sources'
          - cloudflared_facts_debian_repository_signed_by == '/etc/apt/keyrings/cloudflared.gpg'
          - cloudflared_facts_debian_package_spec == 'cloudflared'
          - cloudflared_facts_debian_package_state == 'latest'
          - cloudflared_result_debian_key is changed
          - cloudflared_result_debian_key_url is not defined
          - cloudflared_result_debian_list_repository is not defined
          - cloudflared_result_debian_sources_repository_1 is changed
            or cloudflared_result_debian_sources_repository_2 is changed
          - cloudflared_facts_github_release_tag is not defined
          - cloudflared_facts_github_release_asset is not defined
          - cloudflared_facts_github_release_url is not defined
          - cloudflared_result_github_download_dir is not defined
          - cloudflared_result_github_package_download is not defined
