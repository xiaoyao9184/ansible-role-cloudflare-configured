---
# ref: [[#role_name_check|Go to molecule/README.md#role_name_check]]
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: debian13
    image: geerlingguy/docker-debian13-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host
  - name: node1
    image: geerlingguy/docker-debian13-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host
  - name: node2
    image: geerlingguy/docker-debian13-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host
  - name: node3
    image: geerlingguy/docker-debian13-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host
  - name: node4
    image: geerlingguy/docker-debian13-ansible
    privileged: true
    command: /lib/systemd/systemd
    # tmpfs:
    #   - /run
    #   - /tmp
    volumes:
      # fix `Failed to connect to bus: No such file or directory`
      # see https://www.jeffgeerling.com/blog/2022/docker-and-systemd-getting-rid-dreaded-failed-connect-bus-error
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # fix the startup issue `docker run -it -v /sys/fs/cgroup:/sys/fs/cgroup:rw jrei/systemd-centos:7 /usr/sbin/init`
    # see https://github.com/ansible/molecule/discussions/3349
    # must community.docker > 3.0.0 ansible > 7.0.0
    cgroupns_mode: host

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          debian13:
          node1:
          node2:
          node3:
          node4:
      remote:
        hosts:
          debian13:
          node1:
          node2:
          node3:
          node4:
      same:
        hosts:
          node1:
          node2:
      different:
        hosts:
          node3:
            cloudflared_account_cert_file: >-
              {{
                lookup('env', 'HOME')
                | default('/home/nonroot', true)
                ~
                '/.cloudflared/cert.pem'
              }}
            cloudflared_tunnel_name: >-
              {{
                lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                | default('ansible-role-cloudflare-configured-test-tunnel', true)
              }}
            cloudflared_tunnel_credentials_file: >-
              {{
                lookup('env', 'HOME')
                | default('/home/nonroot', true)
                ~ '/.cloudflared/'
                ~ inventory_hostname
                ~ '/'
                ~ lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                  | default('ansible-role-cloudflare-configured-test-tunnel', true)
                ~ '.json'
              }}
          node4:
            cloudflared_account_cert_file: >-
              {{
                lookup('env', 'HOME')
                | default('/home/nonroot', true)
                ~
                '/.cloudflared/cert.pem'
              }}
            cloudflared_tunnel_name: >-
              {{
                lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                | default('ansible-role-cloudflare-configured-test-tunnel', true)
              }}
            cloudflared_tunnel_credentials_file: >-
              {{
                lookup('env', 'HOME')
                | default('/home/nonroot', true)
                ~ '/.cloudflared/'
                ~ inventory_hostname
                ~ '/'
                ~ lookup('env', 'CLOUDFLARE_TUNNEL_NAME')
                  | default('ansible-role-cloudflare-configured-test-tunnel', true)
                ~ '.json'
              }}
  playbooks:
    prepare: prepare.yml
    converge: converge.version-latest.yml
    side_effect: converge.version-latest.yml

scenario:
  name: docker-debian-13

  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # The `cloudflared_facts_is_installed` variable will change after `idempotence`
    # - idempotence
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.version-specific.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.version-any.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.source-github.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.credentials-vars.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.credentials-copy.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.credentials-token.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.config-vars.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.config-copy.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.config-template.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.tunnel-create.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.tunnel-token.yml
    - side_effect ${MOLECULE_SCENARIO_DIRECTORY}/converge.service-enable.yml
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
