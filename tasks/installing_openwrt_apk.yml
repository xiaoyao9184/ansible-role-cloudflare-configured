---
- name: installing openwrt | Install missing package with apk
  community.openwrt.apk:
    name: "{{ cloudflared_facts_openwrt_package_name }}"
    state: present
    update_cache: true
  register: cloudflared_result_openwrt_apk_install
  when:
    - cloudflared_facts_version_mode == 'any'
    - not cloudflared_facts_is_installed

- name: installing openwrt | Install or refresh latest package with apk
  community.openwrt.command:
    cmd: >-
      apk update &&
      {{
        'apk add ' ~ cloudflared_facts_openwrt_package_name
        if not cloudflared_facts_is_installed
        else 'apk upgrade ' ~ cloudflared_facts_openwrt_package_name
      }}
    uses_shell: true
  register: cloudflared_result_openwrt_apk_latest
  when: cloudflared_facts_version_mode == 'latest'
