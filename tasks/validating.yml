---
# OS-specific setup tasks should be included from this stage file.
- name: validating | Validate package settings
  ansible.builtin.assert:
    that:
      - cloudflared_package_name is string
      - cloudflared_package_name | trim | length > 0
      - cloudflared_package_version is string
      - cloudflared_package_version | trim | length > 0
      - >-
        cloudflared_package_version in ["latest", "any"]
        or
        (
          cloudflared_package_version
          is match('^[0-9]+(\\.[0-9]+){1,3}$')
        )
    fail_msg: >-
      `cloudflared_package_name` must be a non-empty string,
      `cloudflared_package_version` must be one of: `latest`, `any`,
      or a dotted version string such as `2026.2.0`.

- name: validating | Validate installation settings
  ansible.builtin.assert:
    that:
      - cloudflared_github_base_url is string
      - cloudflared_github_base_url | trim | length > 0
      - cloudflared_github_repository is string
      - cloudflared_github_repository | trim | length > 0
      - cloudflared_github_release_asset_arch_mapping is mapping
    fail_msg: >-
      `cloudflared_github_base_url` must be a non-empty string,
      `cloudflared_github_repository` must be a non-empty string,
      `cloudflared_github_release_asset_arch_mapping` must be a mapping.

- name: validating | Validate configuration settings
  ansible.builtin.assert:
    that:
      - cloudflared_controller_binary_path is string
      - cloudflared_account_cert_file is string
      - cloudflared_tunnel_name is string
      - cloudflared_tunnel_credentials_file is string
      - cloudflared_tunnel_token is string
      - cloudflared_credentials_file_target_path is string
      - cloudflared_credentials_file_source_mode in ['copy', 'vars', 'token']
      - cloudflared_credentials_file_source_copy_file is string
      - cloudflared_credentials_file_source_vars_content is mapping
      - cloudflared_credentials_file_source_token is string
      - >-
        (
          cloudflared_credentials_file_source_mode == 'copy'
          and cloudflared_credentials_file_source_copy_file | trim | length > 0
          and cloudflared_credentials_file_source_vars_content | length == 0
          and cloudflared_credentials_file_source_token == ''
        )
        or
        (
          cloudflared_credentials_file_source_mode == 'vars'
          and cloudflared_credentials_file_source_copy_file == ''
          and cloudflared_credentials_file_source_token == ''
        )
        or
        (
          cloudflared_credentials_file_source_mode == 'token'
          and cloudflared_credentials_file_source_copy_file == ''
          and cloudflared_credentials_file_source_vars_content | length == 0
        )
      - cloudflared_config_file_target_path is string
      - cloudflared_config_file_become is boolean
      - cloudflared_config_file_source_mode in ['copy', 'template', 'vars']
      - cloudflared_config_file_source_copy_file is string
      - cloudflared_config_file_source_template_file is string
      - cloudflared_config_file_source_vars_content is mapping
      - >-
        (
          cloudflared_config_file_source_mode == 'copy'
          and cloudflared_config_file_source_copy_file | trim | length > 0
          and cloudflared_config_file_source_template_file == ''
          and cloudflared_config_file_source_vars_content | length == 0
        )
        or
        (
          cloudflared_config_file_source_mode == 'template'
          and cloudflared_config_file_source_template_file | trim | length > 0
          and cloudflared_config_file_source_copy_file == ''
          and cloudflared_config_file_source_vars_content | length == 0
        )
        or
        (
          cloudflared_config_file_source_mode == 'vars'
          and cloudflared_config_file_source_copy_file == ''
          and cloudflared_config_file_source_template_file == ''
        )
    fail_msg: >-
      `cloudflared_controller_binary_path` must be a string,
      `cloudflared_account_cert_file` must be a string,
      `cloudflared_tunnel_name` must be a string,
      `cloudflared_tunnel_credentials_file` must be a string,
      `cloudflared_tunnel_token` must be a string.
      `cloudflared_credentials_file_target_path` must be strings when provided,
      `cloudflared_credentials_file_source_mode` must be one of `copy`, `vars`, or `token`,
      only the selected mode inputs may be populated,
      `cloudflared_credentials_file_source_vars_content` must be a mapping.
      `cloudflared_config_file_target_path` must be strings when provided,
      `cloudflared_config_file_source_mode` must be one of `copy`, `template`, or `vars`,
      only the selected mode inputs may be populated,
      `cloudflared_config_file_source_vars_content` must be a mapping.

- name: validating | Validate control settings
  ansible.builtin.assert:
    that:
      - cloudflared_service_name is string
      - cloudflared_service_enabled is boolean
      - cloudflared_service_state in ["started", "stopped", "restarted", "reloaded"]
      - cloudflared_linux_service_unit_path is string
      - cloudflared_linux_service_unit_path | trim | length > 0
      - cloudflared_macos_launchd_label is string
      - cloudflared_macos_launchd_label | trim | length > 0
      - cloudflared_macos_launchd_plist_path is string
      - cloudflared_macos_launchd_plist_path | trim | length > 0
      - cloudflared_tunnel_run_parameter_args is mapping
      - cloudflared_tunnel_cli_extra_args is sequence
      - cloudflared_tunnel_cli_extra_args is not string
      - cloudflared_tunnel_cli_extra_args | select('string') | list | length == cloudflared_tunnel_cli_extra_args | length
    fail_msg: >-
      `cloudflared_service_name` must be a string,
      `cloudflared_service_enabled` must be a boolean,
      `cloudflared_service_state` must be one of: `started`, `stopped`, `restarted`, `reloaded`.
      `cloudflared_linux_service_unit_path` must be a non-empty string,
      `cloudflared_macos_launchd_label` must be a non-empty string,
      `cloudflared_macos_launchd_plist_path` must be a non-empty string,
      `cloudflared_tunnel_cli_extra_args` must be a list of strings.
