---
# Used only for RedHat os family

cloudflared_github_release_asset_arch_mapping:
  x86_64: x86_64
  amd64: x86_64
  aarch64: aarch64
  arm64: aarch64
  armv7l: armhf
  armv6l: arm
  i386: 386
  i686: 386

# Override RedHat-compatible distribution support scope defaults.
cloudflared_redhat_distribution_support_tier_mapping:
  Amazon: direct
  RedHat: direct
  CentOS: direct
  AlmaLinux: compat
  Rocky: compat
  Fedora: compat

# Override RedHat-compatible package manager defaults.
cloudflared_redhat_package_manager_distribution_major_mapping:
  Amazon:
    default: yum
  RedHat:
    "7": yum
    "8": dnf
    "9": dnf
    default: dnf
  CentOS:
    "7": yum
    "8": dnf
    "9": dnf
    Stream: dnf
    default: dnf
  AlmaLinux:
    default: dnf
  Rocky:
    default: dnf
  Fedora:
    default: dnf
